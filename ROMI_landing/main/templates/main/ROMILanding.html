{% load static %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!-- Nombre provicional -->
        <title>ROMI Landing</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="{% static 'main/css/ROMIBeauty.css' %}">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="{% static 'main/js/ROMILogic.js' %}"></script>
    </head>
    <body id="main-body">
        <nav class="navbar navbar-expand-lg bg-body-tertiary sticky-top">
            <div class="container container-fluid">
                <img src="{% static 'main/images/ROMI_logo.jpg' %}" alt="img">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                    <a class="nav-link" onclick="location.href='#inicio'">Inicio</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link" onclick="location.href='#app'">App</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link" onclick="location.href='#pricing'">Precios</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link" onclick="location.href='#background'">Background</a>
                    </li>
                </ul>
                </div>
                <div class="navbar-nav ms-auto">
                    <button id="theme-btn" class="btn rounded-circle theme">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-moon-stars">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454l0 .008" />
                            <path d="M17 4a2 2 0 0 0 2 2a2 2 0 0 0 -2 2a2 2 0 0 0 -2 -2a2 2 0 0 0 2 -2" />
                            <path d="M19 11h2m-1 -1v2" />
                        </svg>
                    </button>
                </div>
            </div>
        </nav>
        <section id="inicio">
            <div id="what">
                <p id="banner-text">
                    Bienvenido a ROMI,<br> tu asistente medico virtual.
                </p>
                <img id="banner-img" src="{% static 'main/images/ROMI_banner.png' %}" alt="">
            </div>
        </section>
        <section id="app">
            <img style="height: 900px;" src="https://definicion.de/wp-content/uploads/2010/12/largada.jpg" alt="">
        </section>
        <section id="pricing">
            <img style="height: 900px;" src="https://definicion.de/wp-content/uploads/2010/12/largada.jpg" alt="">
        </section>
        <section id="background">
            <img style="height: 900px;" src="https://definicion.de/wp-content/uploads/2010/12/largada.jpg" alt="">
        </section>
    </body>
</html>
